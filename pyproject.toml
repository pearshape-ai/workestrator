[project]
name = "workestrator"
description = "Pearscarf-driven Claude orchestrator: polls intents, dispatches Claude agents, watches for completion."
dynamic = ["version"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "claude-agent-sdk",
    "click",
    "mcp",
    "pyyaml",
]

[project.scripts]
workestrator = "workestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "workestrator/__init__.py"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
